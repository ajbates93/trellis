name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        id: migrate
        run: npm run db:migrate
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Migration failure help
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "❌ Database migration failed on PRODUCTION!"
          echo ""
          echo "⚠️ WARNING: Do NOT delete the production database!"
          echo ""
          echo "This usually means there's a problematic migration."
          echo "You should:"
          echo "1. Check the migration files in server/database/migrations/"
          echo "2. Test the migration on staging first"
          echo "3. If needed, create a reverse migration or fix the problematic migration"
          echo "4. Contact your team before proceeding"
          echo ""
          echo "For non-destructive fixes, you can:"
          echo "1. Connect to the production database manually"
          echo "2. Run the migration SQL manually with appropriate fixes"
          echo "3. Update the migrations table to mark it as applied"
          exit 1

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: v$VERSION"

      - name: Deploy to Railway Production
        run: |
          echo "✅ Migrations completed successfully"
          echo ""
          echo "Railway will auto-deploy from the main branch."
          echo "Configure in Railway Dashboard:"
          echo "  1. Go to Railway → Production Environment → Your Service"
          echo "  2. Settings → Source → Set branch to 'main'"
          echo "  3. Railway will auto-deploy on every push to main branch"
          echo ""
          echo "Deployment will happen automatically via Railway Git integration."

      - name: Deployment notification
        if: success()
        run: |
          echo "Production deployment successful!"
          echo "Version: v${{ steps.version.outputs.version }}"
          echo "URL: ${{ vars.PRODUCTION_URL }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"

      - name: Deployment failed notification
        if: failure()
        run: |
          echo "Production deployment failed!"
          echo "Check the logs above for details."
          echo "Rollback may be required."
          exit 1

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"

          # Check if tag already exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists - skipping release creation"
            echo "This is expected when version wasn't bumped since last release"
          else
            echo "Creating release for version $VERSION"

            # Create annotated tag
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"

            # Generate release notes from commits since last tag
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
            else
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
            fi

            # Create GitHub release
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes "## What's Changed

            $CHANGELOG

            **Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${LAST_TAG}...${VERSION}" \
              --target main

            echo "Created release: $VERSION"
          fi
