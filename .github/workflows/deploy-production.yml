name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        id: migrate
        run: npm run db:migrate
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Migration failure help
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "❌ Database migration failed on PRODUCTION!"
          echo ""
          echo "⚠️ WARNING: Do NOT delete the production database!"
          echo ""
          echo "This usually means there's a problematic migration."
          echo "You should:"
          echo "1. Check the migration files in server/database/migrations/"
          echo "2. Test the migration on staging first"
          echo "3. If needed, create a reverse migration or fix the problematic migration"
          echo "4. Contact your team before proceeding"
          echo ""
          echo "For non-destructive fixes, you can:"
          echo "1. Connect to the production database manually"
          echo "2. Run the migration SQL manually with appropriate fixes"
          echo "3. Update the migrations table to mark it as applied"
          exit 1

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Production
        run: railway up --service ${{ vars.RAILWAY_PRODUCTION_SERVICE_NAME }} --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment notification
        if: success()
        run: |
          echo "Production deployment successful!"
          echo "URL: ${{ vars.PRODUCTION_URL }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"

      - name: Deployment failed notification
        if: failure()
        run: |
          echo "Production deployment failed!"
          echo "Check the logs above for details."
          echo "Rollback may be required."
          exit 1

      - name: Create deployment tag
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG_NAME="production-$(date +%Y%m%d-%H%M%S)"
          git tag -a "$TAG_NAME" -m "Production deployment: ${{ github.sha }}"
          git push origin "$TAG_NAME"
          echo "Created deployment tag: $TAG_NAME"
