# Nixpacks configuration for Railway
# Workaround for npm optional dependencies bug with oxc-parser
# See: https://github.com/npm/cli/issues/4828

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
# Use npm install instead of npm ci to avoid optional dependencies cache bug
cmds = ["npm install --prefer-offline --no-audit"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node .output/server/index.mjs"
